<div *ngIf="!isConnected;else other_content">
  <button (click)="reload()" [disabled]="isReloading">리스트를 갱신</button>
  <button (click)="showRoomSetting()">새로운 방을 작성한다</button>
  <hr/>
  <ng-container *ngIf="rooms.length">
    <table class="room-list">
      <tr>
        <th class="is-0-width is-small-font">방 ID</th>
        <th class="is-small-font">방 이름</th>
        <th class="is-0-width is-small-font">패스워드</th>
        <th class="is-0-width is-small-font">참가자</th>
        <th class="is-0-width is-small-font"></th>
      </tr>
      <ng-container *ngFor="let room of rooms">
        <tr>
          <td class="room-id">{{room.id}}</td>
          <td class="room-name"><div class="room-name-text">{{room.name}}</div></td>
          <td *ngIf="room.hasPassword">
            <i class="material-icons" style="vertical-align: middle; font-size:0.9rem;">lock</i>
          </td>
          <td *ngIf="!room.hasPassword">-</td>
          <td>{{room.peers.length}}인</td>
          <td>
            <button [disabled]="room.id === currentRoom" *ngIf="0 < room.id.length" type="submit" (click)="connect(room)">접속</button>
          </td>
        </tr>
      </ng-container>
    </table>
  </ng-container>
  <span *ngIf="rooms.length < 1" style="font-size: 12px;">{{help}}</span>
</div>
<ng-template #other_content><span style="font-size: 12px;">다른 방에 접속하고 싶은 경우, 다른 참가자와의 접속을 끊어주세요.<br>(※페이지 새로고침으로 끊을 수 있습니다.)</span></ng-template>
