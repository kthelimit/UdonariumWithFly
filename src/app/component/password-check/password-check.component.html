<form #passwordForm="ngForm">
  <div>패스워드: <input #input [(ngModel)]="password" (input)="onInputChange(input.value)" (keypress.enter)="submit()" [ngModelOptions]="{standalone: true}" placeholder="패스워드" #passwordInput /></div>
  <button type="submit" (click)="submit()">입실</button>
</form>
<div>
  <span style="font-size: 12px;">{{help}}</span>
</div>
